name: glucose_app
description: "GLUVER - Glucose Observer, a professional non-invasive glucose monitoring app."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.14.0
  cloud_firestore: ^5.6.9
  firebase_database: ^11.3.7
  firebase_auth: ^5.1.0
  google_sign_in: ^6.1.6
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/gluver_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FDECEC"
  image: assets/images/gluver_icon.png
  android_12:
    color: "#FDECEC"
    image: assets/images/gluver_icon.png
